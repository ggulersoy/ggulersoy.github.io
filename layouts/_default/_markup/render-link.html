<a
	{{- if strings.HasPrefix .Destination "mailto" }}
		href="{{ .Destination | safeURL }}"
	{{- else if or (strings.HasPrefix .Destination "http") (strings.HasPrefix .Destination "#") (strings.HasPrefix .Destination "/") }}
		href="{{ .Destination | safeURL }}"
	{{- end }}
	{{- with .Title }} title="{{ . }}"{{ end }}
	{{- if strings.HasPrefix .Destination "http" }} target="_blank" rel="noopener noreferrer"{{ end }}>
	<span>{{ .Text }}</span>
</a>
